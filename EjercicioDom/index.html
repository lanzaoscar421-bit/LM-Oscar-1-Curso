<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios DOM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Ejercicios de DOM</h1>

    <!-- Ejercicio 2 -->
    <h2 id="mensaje-carga">Cargando contenido...</h2>

    <!-- Ejercicio 3 -->
    <div class="ejercicio">
        <button id="contador-btn">Incrementar contador</button>
        <p>Contador: <span id="contador">0</span></p>
    </div>

    <!-- Ejercicio 4 -->
    <div class="ejercicio" id="caja-color">
        <button id="cambiar-color-btn">Cambiar color de fondo</button>
    </div>

    <!-- Ejercicio 5 y 6 -->
    <div class="ejercicio" id="area-raton">
        <p id="mensaje-raton">Fuera del área</p>
    </div>

    <!-- Ejercicio 7 y 8 -->
    <div class="ejercicio">
        <input type="text" id="input-texto" placeholder="Escribe algo">
        <span id="mostrar-texto"></span>
    </div>

    <!-- Ejercicio 9 -->
    <div class="ejercicio">
        <p>Pulsa cualquier tecla y mira el resultado:</p>
        <span id="tecla-pulsada"></span>
    </div>

    <!-- Ejercicio 10 -->
    <div class="ejercicio">
        <button id="boton-hover" disabled>Botón desactivado</button>
    </div>

</body>
</html>
