<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios UD2 - 1 al 30</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>¡Bienvenido a mi página interactiva!</h1>
    <p id="mensaje">Presiona un botón para ejecutar un ejercicio.</p>

    <!-- Botones de los ejercicios -->
    <button id="boton1">Ejercicio 1: Mayor de edad</button>
    <button id="boton2">Ejercicio 2: Mayor o menor de edad</button>
    <button id="boton3">Ejercicio 3: 20 primeros números</button>
    <button id="boton4">Ejercicio 4: Números pares 2 en 2</button>
    <button id="boton5">Ejercicio 5: Números pares 1 en 1</button>
    <button id="boton6">Ejercicio 6: Números hasta N</button>
    <button id="boton7">Ejercicio 7: Calificación alfabética</button>
    <button id="boton8">Ejercicio 8: Factorial</button>
    <button id="boton9">Ejercicio 9: Sumar un segundo</button>
    <button id="boton10">Ejercicio 10: Números negativos</button>
    <button id="boton11">Ejercicio 11: Contar positivos y negativos</button>
    <button id="boton12">Ejercicio 12: Secuencia hasta 0</button>
    <button id="boton13">Ejercicio 13: Suma y producto de 10 números</button>
    <button id="boton14">Ejercicio 14: Calcular salario neto</button>
    <button id="boton15">Ejercicio 15: Par o impar</button>
    <button id="boton16">Ejercicio 16: Mayor entre dos</button>
    <button id="boton17">Ejercicio 17: Mayor de tres</button>
    <button id="boton18">Ejercicio 18: Tabla de multiplicar</button>
    <button id="boton19">Ejercicio 19: Suma 1 hasta N</button>
    <button id="boton20">Ejercicio 20: Tabla de 1 a 20</button>
    <button id="boton21">Ejercicio 21: Números 100 a 1</button>
    <button id="boton22">Ejercicio 22: Múltiplos de 5</button>
    <button id="boton23">Ejercicio 23: Suma 5 números</button>
    <button id="boton24">Ejercicio 24: Media 5 números</button>
    <button id="boton25">Ejercicio 25: Contar hasta -1</button>
    <button id="boton26">Ejercicio 26: Suma de cifras</button>
    <button id="boton27">Ejercicio 27: Positivo, negativo o cero</button>
    <button id="boton28">Ejercicio 28: Divisores de un número</button>
    <button id="boton29">Ejercicio 29: Número primo</button>
    <button id="boton30">Ejercicio 30: Números impares hasta N</button>

    <script src="script.js"></script>
</body>
</html>
